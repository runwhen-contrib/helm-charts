{{- if .Values.runner.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runner.runnerFullname" . }}-metrics
  labels:
    {{- include "runner.labels" . | nindent 4 }}
    app: runner
    app.kubernetes.io/component: runner-metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 9090
  selector:
    {{- include "runner.runnerSelectorLabels" . | nindent 4 }}
{{- end }}
