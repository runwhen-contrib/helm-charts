{{/*
  Bootstrap relay config for the bundled OTel collector.

  The RUNNER owns this file. Once it has fetched /api/v1/runner/config it
  rewrites `data.relay` with the full config — the OTLP metrics destination the
  platform states (which follows the rest of the platform's observability:
  OpenObserve, or the customer's own OTLP endpoint) plus the worker scrape
  jobs — and restarts the collector. So this template only has to be a VALID
  config that lets the collector start before the runner first runs; it accepts
  OTLP and drops to the debug exporter.

  `metrics.url` and the metrics/logs OTLP values are therefore no longer read
  by this chart: the destination is runtime config the runner owns, not a Helm
  value (helm-charts#100). Kept as values only so an existing values file does
  not error; they have no effect.
*/}}
{{- define "runner.otelCollectorBootstrapRelay" -}}
extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:MY_POD_IP}:4318
      grpc:
        endpoint: ${env:MY_POD_IP}:4317
exporters:
  debug:
    verbosity: basic
processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048
service:
  pipelines:
    metrics/otlp:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
  extensions: [health_check]
  telemetry:
    logs:
      level: info
{{- end -}}
{{- $otelCol := (.Values.runner.otelCollector | default dict) -}}
{{- $otelEnabled := ternary $otelCol.enabled true (hasKey $otelCol "enabled") -}}
{{- if and .Values.runner.enabled $otelEnabled -}}
{{- $cmName := include "runner.configMapName.otelCollector" . -}}
{{/*
  Preserve the runner-written config across `helm upgrade`. A plain render would
  reset it to this bootstrap on every upgrade (Flux bumps the image tag, say),
  silently dropping metrics until the runner restarts. `lookup` returns nil
  under `helm template`/`--dry-run`, so a fresh install still gets the bootstrap.
*/}}
{{- $existing := lookup "v1" "ConfigMap" .Release.Namespace $cmName -}}
{{- $relay := include "runner.otelCollectorBootstrapRelay" . -}}
{{- if and $existing $existing.data (index $existing.data "relay") -}}
{{- $relay = index $existing.data "relay" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cmName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runner.labels" . | nindent 4 }}
    app: otel-collector
    app.kubernetes.io/component: otel-collector
data:
  relay: |
{{ $relay | indent 4 }}
{{- end }}
