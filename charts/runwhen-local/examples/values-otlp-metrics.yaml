# =============================================================================
# OTLP metrics + logs export overlay (migration path off Cortex/Mimir)
# =============================================================================
# Enables the opt-in OTLP exporters on the runner's bundled OTel collector so
# runner metrics AND logs can be sent to RunWhen's OpenObserve-backed
# observability service (via its in-cluster OTLP collector) instead of — or in
# addition to — Cortex/Mimir.
#
# Render to inspect:
#
#   helm template rw charts/runwhen-local \
#     -f charts/runwhen-local/examples/values-otlp-metrics.yaml \
#     | sed -n '/exporters:/,/processors:/p'
#
# The metrics defaults below are additive: Cortex keeps exporting to
# `runner.metrics.url` while OTLP is also enabled, so the migration can be
# validated before cutting over. Set `keepCortex: false` once verified.
#
# Logs are a separate opt-in. Here `runner.logs.otlp.endpoint` is left empty, so
# it falls back to `runner.metrics.otlp.endpoint`: one collector endpoint serves
# both signals. See examples/values-otlp-logs.yaml for a per-signal endpoint.
#
# Endpoint shape (choose one):
#   * OTLP/HTTP base endpoint  -> the collector appends `/v1/metrics` or `/v1/logs`
#       endpoint: "http://<release>-otel-collector:4318"
#   * OTLP/HTTP per-signal URL -> used verbatim
#       endpoint: "http://<release>-otel-collector:4318/v1/metrics"
#   * OTLP/gRPC host:port      -> set protocol: grpc
#       endpoint: "<release>-otel-collector:4317"
#
# Adjust `<release>` to your Helm release name. The bundled
# opentelemetry-collector subchart's service is named
# `{prefix}otel-collector` for the same release.

runner:
  metrics:
    otlp:
      enabled: true
      # OTLP/HTTP base endpoint; `/v1/metrics` is appended by the exporter.
      endpoint: "http://rw-runwhen-local-otel-collector:4318"
      # protocol defaults to http/protobuf; use `grpc` with a host:port
      # endpoint (e.g. rw-runwhen-local-otel-collector:4317) for OTLP/gRPC.
      protocol: "http/protobuf"
      # Optional headers for an authenticated endpoint, e.g.
      # headers:
      #   Authorization: "Bearer <token>"
      headers: {}
      # `true` (default): keep exporting to Cortex while also exporting
      # OTLP. `false` cuts over so OTLP is the only destination.
      keepCortex: true

  # Logs counterpart. Ships runner/worker stdout logs to the same OTLP
  # endpoint. Independent of metrics: its own endpoint/protocol/headers.
  logs:
    otlp:
      enabled: true
      # Empty -> fall back to runner.metrics.otlp.endpoint above. Set an
      # explicit base or per-signal endpoint to route logs elsewhere.
      endpoint: ""
      protocol: "http/protobuf"
      headers: {}
