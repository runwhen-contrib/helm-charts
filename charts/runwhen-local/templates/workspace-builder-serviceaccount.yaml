{{- $wb := include "runwhen-local.resolveWorkspaceBuilder" . | fromYaml -}}
{{- if $wb.enabled -}}
{{- if $wb.serviceAccount.create -}}
{{- /*
  SA name is resolved through the parent helper so the default is the
  release-derived {prefix}workspace-builder. Explicit
  .Values.workspaceBuilder.serviceAccount.name still wins.
*/}}
{{- $saName := include "runwhen-local.serviceAccountName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  labels:
    {{- include "runwhen-local.workspaceBuilderLabels" . | nindent 4 }}
  {{- with $wb.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    kubernetes.io/service-account.token-expiration: "31536000"  # 1 year in seconds
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $saName }}-token
  labels:
    {{- include "runwhen-local.workspaceBuilderLabels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ $saName }}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}-sa-local-view
  labels:
    {{- include "runwhen-local.workspaceBuilderLabels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "configmaps", "services", "replicationcontrollers", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}-sa-local-view-rb
  labels:
    {{- include "runwhen-local.workspaceBuilderLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}-sa-local-view
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}-sa-secret-manage
  labels:
    {{- include "runwhen-local.workspaceBuilderLabels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "update", "delete", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}-sa-secret-manage-rb
  labels:
    {{- include "runwhen-local.workspaceBuilderLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}-sa-secret-manage
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
