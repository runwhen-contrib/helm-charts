{{/*
TODO: prefix SA, role, and rolebinding names with runnerFullname once
runner-control is updated to override the service account properly. The
SA name is currently consumed by .Values.runner.runEnvironment.{deployment,pod}.serviceAccount
(default "runner"); both ends must move together.

Operators with multi-release namespace requirements can opt in today by
setting .Values.runner.serviceAccount.name (resolved via
runwhen-local.serviceAccountName.runner) AND aligning the
runEnvironment serviceAccount values to match.
*/}}
{{- if .Values.runner.enabled -}}
{{- /*
  ServiceAccount creation gate.

  WHY THIS LOOKS LIKE OVERKILL: the previous gate
    {{- if (.Values.runner.serviceAccount | default dict).create | default true -}}
  silently turned `create: false` into `create: true`, because in Go
  templates `false | default true` evaluates to `true` (`default` treats
  `false` as "empty"). That meant operators on restricted clusters who
  wanted to pre-create the runner SA externally still got a chart-rendered
  SA, with the duplicate-resource error on `helm install`.

  The ternary form below preserves the implicit `create: true` default for
  values files that omit the key entirely, while honouring an explicit
  `create: false`.
*/}}
{{- $sa := .Values.runner.serviceAccount | default dict -}}
{{- $create := ternary $sa.create true (hasKey $sa "create") -}}
{{- /*
  Hosted MCP needs a `services` RBAC rule on the runner's Role (below),
  but that whole Role/RoleBinding is gated on $create — a BYO runner SA
  (serviceAccount.create: false) renders NO Role/RoleBinding at all,
  chart-managed or otherwise. Without this check, that combination
  installs cleanly and only fails later, at runtime, with Forbidden the
  first time the runner tries to create a hosted server's Service. Fail
  the render instead unless the operator has acknowledged (via
  runner.rbac.hostedProvided) that they granted the `services` rule
  themselves — see examples/byo-rbac.yaml.
*/}}
{{- if and .Values.runner.mcp.hosted.enabled (not $create) (not (.Values.runner.rbac | default dict).hostedProvided) -}}
{{- fail "runner.mcp.hosted.enabled is true and runner.serviceAccount.create is false, so this chart renders NO Role/RoleBinding for the runner — including the `services` rule the runner needs to create hosted-server Services. Either set runner.serviceAccount.create: true, or grant that rule on your externally-managed runner Role (see examples/byo-rbac.yaml) and set runner.rbac.hostedProvided: true to acknowledge you've done so." -}}
{{- end -}}
{{- if $create -}}
{{- $saName := include "runwhen-local.serviceAccountName.runner" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "runwhen-local.runnerLabels" . | nindent 4 }}
    app: runner
  {{- with (.Values.runner.serviceAccount | default dict).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "runwhen-local.runnerLabels" . | nindent 4 }}
    app: runner
  name: {{ $saName }}-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}-role
subjects:
- kind: ServiceAccount
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "runwhen-local.runnerLabels" . | nindent 4 }}
    app: runner
  name: {{ $saName }}-role
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups: 
  - ""
  resources:
  - pods
  - pods/exec
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - delete
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update
{{- if .Values.runner.mcp.hosted.enabled }}
{{- /*
  A hosted MCP server needs a stable in-cluster address, so the runner
  creates a Service alongside the Deployment/ConfigMap/Secret it already
  renders for the server. Gated on hosted.enabled: an operator who has
  not opted into hosting must not silently gain this grant on upgrade.
*/}}
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
{{- end }}
{{- end }}
{{- if .Values.runner.mcp.hosted.enabled }}
{{- /*
  Dedicated hosted-MCP ServiceAccount. Gated independently of the
  runner's own SA creation above ($create): an operator may run the
  runner under a pre-created SA (runner.serviceAccount.create: false)
  while still wanting the chart to create this one, or vice versa.

  Deliberately rendered with NO annotations, and this must stay that
  way. On GKE, Workload Identity resolves the mapped GCP identity by
  reading the `iam.gke.io/gcp-service-account` annotation off *this* SA
  object regardless of whether a token is auto-mounted, so any
  annotation here is exactly what must not be inherited from the
  runner's own SA — hosted pods run arbitrary third-party npm/PyPI
  packages and must not be able to reach the runner's cloud identity.
  Operators who need workload identity for the hosted server should
  annotate this SA themselves post-install, or bring their own via
  runner.mcp.hosted.serviceAccountName.
*/}}
{{- $mcpSa := .Values.runner.mcp.hosted.serviceAccount | default dict -}}
{{- if ternary $mcpSa.create true (hasKey $mcpSa "create") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "runwhen-local.runnerLabels" . | nindent 4 }}
    app: runner
  name: {{ include "runwhen-local.serviceAccountName.mcpHostedCreated" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
